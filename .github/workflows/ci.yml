name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan source and history
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ARCHIVE_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          install -d -m 700 "$RUNNER_TEMP/gitleaks"
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_ARCHIVE_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks" gitleaks
          "$RUNNER_TEMP/gitleaks/gitleaks" git --redact \
            --config .gitleaks.toml --log-opts="--all" .

  test:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.3"

      - name: Install exact Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.20.0"

      - name: Install exact runtime
        run: |
          uv python install 3.12
          uv sync --frozen --all-extras
          test "$(node --version)" = "v24.20.0"
          test "$(uv run --frozen --no-sync graphify --version)" = "graphify 0.9.48"
          npm ci --ignore-scripts --prefix vendor/openspec-runtime
          npm ci --ignore-scripts --prefix vendor/teamai-runtime
          test "$(node -p "require('./vendor/openspec-runtime/node_modules/@fission-ai/openspec/package.json').version")" = "1.10.0"
          test "$(node -p "require('./vendor/teamai-runtime/node_modules/teamai-cli/package.json').version")" = "0.20.0"

      - name: Test and compile
        run: |
          uv run --frozen --no-sync pytest -q
          uv run --frozen --no-sync python -m compileall -q src tests

      - name: Build source and wheel artifacts
        run: |
          uv build
          uv run --frozen --no-sync python scripts/verify_distribution.py \
            dist/project_continuity-0.1.3-py3-none-any.whl \
            dist/project_continuity-0.1.3.tar.gz
          uv venv "$RUNNER_TEMP/project-continuity-wheel" --python 3.12
          uv pip install \
            --python "$RUNNER_TEMP/project-continuity-wheel/bin/python" \
            "project-continuity[mcp-client] @ file://$GITHUB_WORKSPACE/dist/project_continuity-0.1.3-py3-none-any.whl"
          "$RUNNER_TEMP/project-continuity-wheel/bin/python" -c \
            'import project_continuity; assert project_continuity.__version__ == "0.1.3"'
          "$RUNNER_TEMP/project-continuity-wheel/bin/project-continuity" --help
          "$RUNNER_TEMP/project-continuity-wheel/bin/project-continuity-front" --help
          "$RUNNER_TEMP/project-continuity-wheel/bin/project-continuity-mcp" --help
          test -f "$RUNNER_TEMP/project-continuity-wheel/share/project-continuity/skills/project-continuity/SKILL.md"
          test -f "$RUNNER_TEMP/project-continuity-wheel/share/project-continuity/uv.lock"

      - name: Check patch whitespace
        run: git diff --check

  r4c-linux-cold-start:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.3"

      - name: Install exact Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.20.0"

      - name: Install exact full-front runtime
        run: |
          uv python install 3.12
          uv sync --frozen --all-extras
          test "$(node --version)" = "v24.20.0"
          test "$(uv run --frozen --no-sync graphify --version)" = "graphify 0.9.48"
          npm ci --ignore-scripts --prefix vendor/openspec-runtime
          npm ci --ignore-scripts --prefix vendor/teamai-runtime
          test "$(node -p "require('./vendor/openspec-runtime/node_modules/@fission-ai/openspec/package.json').version")" = "1.10.0"
          test "$(node -p "require('./vendor/teamai-runtime/node_modules/teamai-cli/package.json').version")" = "0.20.0"

      - name: Build fresh wheel client
        run: |
          uv build
          uv venv "$RUNNER_TEMP/project-continuity-wheel" --python 3.12
          uv pip install \
            --python "$RUNNER_TEMP/project-continuity-wheel/bin/python" \
            "project-continuity[mcp-client] @ file://$GITHUB_WORKSPACE/dist/project_continuity-0.1.3-py3-none-any.whl"

      - name: Exercise provider-free full front through fresh wheel MCP
        run: |
          uv run --frozen --no-sync python scripts/r4c_linux_cold_start.py \
            --front-command "$GITHUB_WORKSPACE/.venv/bin/project-continuity-front" \
            --mcp-command "$RUNNER_TEMP/project-continuity-wheel/bin/project-continuity-mcp" \
            --skill "$RUNNER_TEMP/project-continuity-wheel/share/project-continuity/skills/project-continuity/SKILL.md"
